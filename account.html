<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার একাউন্ট - MarketKoro</title>

  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- CSS Design Tokens & Modules -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Anti-Flash Theme Script -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('marketkoro_theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <div class="container">
      <div class="header-top">
        <!-- Logo -->
        <a href="index.html" class="brand-logo" aria-label="MarketKoro Home">
          <img src="assets/images/brand/marketkoro-logo.png" alt="MarketKoro" width="170" height="48">
        </a>

        <!-- Header Actions: Language, Theme, Mobile Nav Toggle -->
        <div class="header-actions">
          <button id="lang-toggle-btn" class="btn btn-outline btn-sm" aria-label="Language Switcher">English</button>
          <button id="theme-toggle-btn" class="btn btn-outline btn-icon" aria-label="Toggle Light/Dark Theme">🌙</button>
          <button id="mobile-nav-toggle-btn" class="btn btn-outline btn-icon mobile-nav-toggle" aria-label="Toggle Mobile Menu">☰</button>
        </div>
      </div>

      <!-- Main Navigation -->
      <nav class="navbar" id="navbar">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link" data-i18n="nav.home">হোম</a></li>
          <li><a href="index.html#categories" class="nav-link" data-i18n="nav.categories">ক্যাটাগরি</a></li>
          <li><a href="index.html#featured-products" class="nav-link" data-i18n="nav.products">পণ্যসমূহ</a></li>
          <li><a href="index.html#featured-sellers" class="nav-link" data-i18n="nav.stores">স্টোর ও সেলার</a></li>
          <li id="nav-account-item"><a href="account.html" class="nav-link active" data-i18n="nav.account">একাউন্ট</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Account Dashboard Area -->
  <main class="main-content">
    <div class="container">
      <div id="account-root" style="margin-top: var(--space-6); min-height: 400px;">
        <!-- Dynamically rendered by js/account/account-ui.js -->
        <div style="text-align: center; padding: var(--space-8);">
          <span class="loading-spinner" style="width: 2rem; height: 2rem;"></span>
          <p style="margin-top: var(--space-2);" data-i18n="common.loading">লোড হচ্ছে...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <a href="index.html" class="brand-logo" style="margin-bottom: var(--space-4);">
            <img src="assets/images/logo.svg" alt="MarketKoro" width="200" height="44">
          </a>
          <p class="footer-link" data-i18n="footer.about_desc">
            মার্কেটকোরো বাংলাদেশের আধুনিক মাল্টি-ভেন্ডার ই-কমার্স প্ল্যাটফর্ম।
          </p>
        </div>

        <div>
          <h4 class="footer-col-title" data-i18n="footer.quick_links">প্রয়োজনীয় লিংক</h4>
          <ul class="footer-links">
            <li><a href="index.html#categories" class="footer-link" data-i18n="nav.categories">ক্যাটাগরি</a></li>
            <li><a href="index.html#featured-products" class="footer-link" data-i18n="nav.products">পণ্যসমূহ</a></li>
          </ul>
        </div>

        <div>
          <h4 class="footer-col-title" data-i18n="footer.customer_care">কাস্টমার সাপোর্ট</h4>
          <ul class="footer-links">
            <li><a href="#privacy" class="footer-link" data-i18n="footer.privacy_policy">প্রাইভেসি পলিসি</a></li>
            <li><a href="#terms" class="footer-link" data-i18n="footer.terms">ব্যবহারের শর্তাবলী</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <div data-i18n="footer.copyright">© ২০২৬ মার্কেটকোরো। সর্বস্বত্ব সংরক্ষিত।</div>
      </div>
    </div>
  </footer>

  <!-- Customer Account Script -->
  <script type="module" src="js/account/account-ui.js"></script>
</body>
</html>
